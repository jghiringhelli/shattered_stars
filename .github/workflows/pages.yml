name: Deploy to GitHub Pages

# Publishes the game when the `release` branch is pushed (and on demand from
# the Actions tab). The full CI gates (ci.yml: static checks, tests, skill gates,
# build budget, e2e) must be green first; a red build never ships.
# One-time setup: Settings > Pages > Source: "GitHub Actions" (docs/RELEASE.md).
on:
  push:
    branches: [release]
  workflow_dispatch:

# Least-privilege token: allow Pages deploy + OIDC id-token, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight production deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Pages serves project sites under /<repo>/; vite.config.ts reads BASE_PATH.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Relay address players connect to (Settings → Variables → Actions → VITE_ONLINE_URL,
          # e.g. wss://shattered-stars-relay.fly.dev). Empty = online play shows "no server configured".
          # It is also the only external origin the Content-Security-Policy allows (vite.config.ts).
          VITE_ONLINE_URL: ${{ vars.VITE_ONLINE_URL }}
          # Optional feedback form (Variables → VITE_FEEDBACK_URL). Empty = GitHub new-issue page.
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
          # Players are only matched with identical builds (lockstep needs identical game data).
          VITE_GAME_BUILD: ${{ github.sha }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
