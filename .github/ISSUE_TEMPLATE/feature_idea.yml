name: Feature idea
description: "Suggest something new: a mode, ship, option or quality-of-life change."
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What problem does it solve, or why would it be fun?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways it could work (optional)
  - type: input
    id: version
    attributes:
      label: Build
      description: The tag in the main-menu corner.
