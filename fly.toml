# Fly.io config for the Shattered Stars relay.
# Deploy from the repository root:  fly launch --no-deploy --copy-config   (first time)
#                                   fly deploy
# See docs/ONLINE.md for the full walkthrough.

app = "shattered-stars-relay"   # change if the name is taken (must match VITE_ONLINE_URL)
primary_region = "iad"          # pick the region closest to most players (fly platform regions)

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8080"
  LOG_LEVEL = "info"
  # Browsers may only connect from the published game (comma-separated list).
  ALLOWED_ORIGINS = "https://jghiringhelli.github.io"
  RECONNECT_WINDOW_MS = "30000"
  TRUST_PROXY = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms live in memory: keep exactly one machine running so every player meets on it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
