<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shattered Stars</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #0a0a0a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #game-container {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #tutorial-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(5, 5, 16, 0.82);
        backdrop-filter: blur(2px);
        z-index: 1000;
        font-family: Arial, sans-serif;
      }
      #tutorial-overlay.hidden {
        display: none;
      }
      #tutorial-overlay .panel {
        width: min(520px, 90vw);
        border: 1px solid #445577;
        border-radius: 10px;
        background: linear-gradient(180deg, #10142a 0%, #0a0c1a 100%);
        box-shadow: 0 0 40px rgba(80, 120, 255, 0.25);
        padding: 28px 32px;
        color: #ccddee;
      }
      #tutorial-overlay h1 {
        margin: 0 0 6px;
        font-size: 24px;
        color: #ffffff;
        letter-spacing: 1px;
      }
      #tutorial-overlay p.subtitle {
        margin: 0 0 18px;
        font-size: 13px;
        color: #88aacc;
      }
      #tutorial-overlay ul {
        list-style: none;
        margin: 0 0 18px;
        padding: 0;
      }
      #tutorial-overlay li {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 6px 0;
        border-bottom: 1px solid rgba(80, 100, 140, 0.25);
        font-size: 14px;
      }
      #tutorial-overlay li span.key {
        font-family: monospace;
        color: #ffcc66;
      }
      #tutorial-overlay p.footnote {
        margin: 0 0 18px;
        font-size: 12px;
        color: #667799;
      }
      #tutorial-overlay button {
        display: block;
        margin: 0 auto;
        padding: 10px 28px;
        font-size: 15px;
        font-weight: bold;
        color: #ffffff;
        background: #334477;
        border: 1px solid #6688cc;
        border-radius: 6px;
        cursor: pointer;
      }
      #tutorial-overlay button:hover {
        background: #445599;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="tutorial-overlay" class="hidden">
      <div class="panel">
        <h1>WELCOME TO SHATTERED STARS</h1>
        <p class="subtitle">Tactical starship combat — the basics</p>
        <ul id="tutorial-tips"></ul>
        <p class="footnote">
          Full reference anytime: Main Menu → CONTROLS. Every scheme
          (keyboard, gamepad, touch) works the same way.
        </p>
        <button id="tutorial-dismiss">GOT IT</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
